  @font-face{font-family:"NHD";font-weight:500;font-style:normal;font-display:swap;src:url("./assets/nhd-500.woff2") format("woff2")}
  :root{--bg:#141413;--ink:#f7f6f4;--font:"NHD","Neue Haas Grotesk Display Pro","Neue Haas Grotesk Text Pro","Neue Haas Grotesk",Inter,system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}

  body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;-webkit-font-smoothing:antialiased}

  a::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s ease}
  a:hover::after,a:focus-visible::after{transform:scaleX(1)}
  a:focus-visible{outline:1px solid currentColor;outline-offset:4px}
  main{text-align:center}
  h1{font-size:clamp(24px,4vw,40px);font-weight:500;letter-spacing:-.04em}
  p{margin-top:12px;opacity:.5}
  @media(max-width:600px){nav{top:calc(12px + env(safe-area-inset-top,0px));gap:32px}nav a{font-size:15px;padding:10px 0}}
  @media(prefers-reduced-motion:reduce){a::after{transition:none}}
