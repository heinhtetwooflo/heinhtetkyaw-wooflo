  @font-face{font-family:"NHD";font-weight:500;font-style:normal;font-display:swap;src:url("/assets/nhd-500.woff2") format("woff2")}

  :root{
    --side-gutter:clamp(28px,5vw,80px);
    --page-bottom:clamp(24px,5vh,52px);
    --bg:#ffffff;
    --ink:#141413;
    --mute:#141413;
    color-scheme:light;
    --font:"NHD","Neue Haas Grotesk Display Pro","Neue Haas Grotesk Text Pro","Neue Haas Grotesk",Inter,system-ui,sans-serif;
    --ease:cubic-bezier(.3,.7,.15,1);
    --spring:cubic-bezier(.2,1.35,.35,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html.fonts-pending body{visibility:hidden}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;font-size:clamp(13px,1.74vh,19px);
    overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }

  /* ---------- nav (same as home) ---------- */
  #top-nav{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:50%;z-index:2500;display:flex;gap:clamp(28px,5vw,56px);transform:translateX(-50%)}
  #top-nav a{position:relative;color:#4D4D4D;font-family:var(--font);font-weight:500;text-decoration:none;font-size:19px;letter-spacing:-.01em;padding:6px 0}
  #top-nav a::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
  #top-nav a:hover::after,#top-nav a:focus-visible::after{transform:scaleX(1)}
  #top-nav a:focus-visible{outline:none}
  #logo.logo-on-light{color:#4D4D4D}
  @media (max-width:600px){
    #top-nav{top:calc(12px + env(safe-area-inset-top,0px));gap:32px}
    #top-nav a{font-size:18px;padding:10px 0}
  }

  main{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 var(--side-gutter);
    position:relative;text-align:center;
  }

  /* ---------- figure ---------- */
  #figure{
    position:absolute;left:50%;top:calc(50% - 24px);display:block;width:min(39.4vw,32.85vh);height:auto;overflow:visible;
    transform:translate(-50%,-50%);
    touch-action:manipulation;cursor:pointer;
  }
  #figure .zone{fill:transparent}
  #figure .face-shift,#figure .brain-shift{transform-box:fill-box;transform-origin:center;transition:transform .65s var(--spring)}
  #figure.lift-brain .brain-shift{transform:translateY(-28px) rotate(-1.5deg)}
  #figure.drop-face  .face-shift {transform:translateY(28px)}
  #figure .brain-bob{transform-box:fill-box;transform-origin:center;animation:bob 3.2s cubic-bezier(.37,0,.63,1) infinite}
  @keyframes bob{
    0%,100%{transform:translateY(-6px) rotate(-.1deg)}
    40%{transform:translateY(-20px) rotate(.15deg)}
  }

  h1{
    position:absolute;left:var(--side-gutter);right:var(--side-gutter);bottom:var(--page-bottom);
    color:#4D4D4D;font-weight:500;font-size:19px;letter-spacing:-.01em;line-height:1.25;opacity:.55;
  }

  /* ---------- easter egg (same as home) ---------- */
  #egg{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;pointer-events:none;outline:none}
  #egg{inset:auto;width:0;height:0}
  #egg.show{display:flex;pointer-events:none}
  #egg .bob{display:block}
  #egg img{
    display:block;width:min(36vw,30vh);height:auto;pointer-events:auto;cursor:pointer;-webkit-user-drag:none;
    filter:drop-shadow(0 22px 34px rgba(0,0,0,.28));
  }
  @media (max-width:600px){
    main{padding:0 var(--side-gutter)}
    #figure{top:calc(50% - 38px);width:min(46vw,37vh)}
    h1{left:var(--side-gutter);right:var(--side-gutter);bottom:calc(80px + env(safe-area-inset-bottom,0px));font-size:18px;text-align:center}
    #egg img{width:min(42vw,34vh)}
  }
  .circle-choice{border-color:rgba(20,20,19,.52)}
  #fill-preview{border-color:rgba(20,20,19,.62);background:rgba(20,20,19,.035)}
  #cursor-mark svg{stroke:var(--ink)}
  #cursor-mark.over-logo{opacity:0}
  #hold-ring .hold-progress{fill:var(--ink)}

  @media (prefers-reduced-motion:reduce){
    #figure .brain-bob{animation:none;transform:translateY(-12px)}
    #figure .face-shift,#figure .brain-shift{transition-duration:.01s}
  }
</style>
