<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141413">
<title>Hein Htet Kyaw (Woo Flo) — Designer &amp; Interactive Portfolio</title>
<meta name="description" content="Explore the work and profile of Hein Htet Kyaw (Woo Flo), a designer exploring typography, layouts, and playful interactive web experiences.">
<link rel="canonical" href="https://h-wf.online/">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preload" href="/assets/nhd-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/nhd-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site-navigation.css">
<style>
  :root{
    color-scheme:dark;
    --bg:#141413;
    --ink:#f7f6f4;
    --font:"NHD","Neue Haas Grotesk Display Pro","Neue Haas Grotesk Text Pro","Neue Haas Grotesk",Inter,system-ui,sans-serif;
    --ease:cubic-bezier(.3,.7,.15,1);
    --fs:clamp(48px,11vw,150px);
    --side-gutter:clamp(28px,5vw,80px);
  }
  @font-face{font-family:"NHD";font-weight:700;font-style:normal;font-display:swap;src:url("/assets/nhd-700.woff2") format("woff2")}
  @font-face{font-family:"NHD";font-weight:500;font-style:normal;font-display:swap;src:url("/assets/nhd-500.woff2") format("woff2")}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scrollbar-width:none}
  html::-webkit-scrollbar{display:none}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow-x:hidden}
  #logo{position:fixed;z-index:2600}
  .logo-home.logo-scrolled{
    left:calc(var(--side-gutter,28px) - .35em + env(safe-area-inset-left,0px));
    top:calc(var(--nav-inset,20px) + env(safe-area-inset-top,0px));
    font-size:36px;padding:.3em .35em;transform:none;
    transition-duration:.58s;
  }
  #top-nav{position:fixed;z-index:2700;mix-blend-mode:difference}
  #top-nav a{color:#f7f6f4}
  main{margin:0}
  .page-section{position:relative;width:100%;height:100vh;height:100svh;min-height:100svh;overflow:hidden}
  .page-section iframe{display:block;width:100%;height:100%;border:0}
  #home{background:#141413}
  #works{background:#fff}
  #tmi{background:#141413}
  @media (max-width:600px){
    .logo-home.logo-scrolled{font-size:34px}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .logo-home.logo-scrolled{transition:none}
  }
</style>
<script defer src="/assets/site-navigation.js"></script>
</head>
<body>
<div class="logo logo-home" id="logo" aria-label="heinhtetkyaw.wooflo">
  <span class="cs ch" aria-hidden="true"><svg class="g" viewBox="0 0 212.772 238.313"><path fill="#404040" d="M0 238.313L0 0L69.6958 0V87.3349H143.076V0L212.772 0V238.313H143.076V145.002H69.6958V238.313H0Z"/></svg><span class="t">h</span></span>
  <span class="seg" aria-hidden="true"><span>einhtetkyaw</span></span>
  <span class="sep" aria-hidden="true"><i class="dash"><svg class="g" viewBox="229.151 0 84.236 238.313"><path fill="#404040" d="M229.151 150.986V87.3438H313.387V150.986H229.151Z"/></svg><span class="t">-</span></i><i class="dot">.</i></span>
  <span class="cs cw" aria-hidden="true"><svg class="g" viewBox="302.644 0 324.806 238.313"><path fill="#404040" d="M363.684 238.313L302.644 0L372.339 0L389.685 81.6377L401.365 147.955H402.025C406.231 124.193 410.368 103.176 414.365 84.9727L432.719 0L495.741 0L514.095 84.3126L526.087 147.955L526.748 147.955Q530.954 121.067 538.74 80.9776L556.086 0L627.45 0L564.741 238.313H494.385L473.042 137.325L464.699 90.9826H464.039C461.362 108.109 458.581 123.533 455.696 137.325L435.013 238.313H363.649H363.684Z"/></svg><span class="t">w</span></span>
  <span class="seg" aria-hidden="true"><span>oo</span></span>
  <span class="cs cf" aria-hidden="true"><svg class="g" viewBox="623.3 0 183.746 238.313"><path fill="#404040" d="M623.3 238.313V0H807.046V58.6749L692.996 58.6749V97.6526H787.372V151.638H692.996V238.278H623.3V238.313Z"/></svg><span class="t">f</span></span>
  <span class="seg" aria-hidden="true"><span>lo</span></span>
</div>
<nav id="top-nav" aria-label="Pages">
  <a href="#works">Works</a>
  <a href="#tmi">TMI</a>
</nav>
<main>
  <section class="page-section" id="home" aria-label="Home">
    <iframe src="/home-content.html" title="Home — H-WF interactive portfolio" allow="fullscreen" loading="eager"></iframe>
  </section>
  <section class="page-section" id="works" aria-label="Works">
    <iframe src="/works.html" title="Works — H-WF interactive portrait" allow="fullscreen" loading="lazy"></iframe>
  </section>
  <section class="page-section" id="tmi" aria-label="TMI">
    <iframe src="/TMI.html" title="TMI — About Hein Htet Kyaw" allow="fullscreen" loading="lazy"></iframe>
  </section>
</main>
<script>
  const sections = [...document.querySelectorAll('.page-section')];
  const navLinks = [...document.querySelectorAll('#top-nav a')];
  const logo = document.getElementById('logo');

  const updateLogo = () => logo.classList.toggle('logo-scrolled', window.scrollY > 48);
  window.addEventListener('scroll', updateLogo, { passive: true });
  updateLogo();

  const sectionObserver = new IntersectionObserver(entries => {
    const active = entries
      .filter(entry => entry.isIntersecting)
      .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!active) return;
    navLinks.forEach(link => {
      if (link.hash === `#${active.target.id}`) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }, { threshold: [0.25, 0.5, 0.75] });
  sections.forEach(section => sectionObserver.observe(section));

  document.querySelectorAll('.page-section iframe').forEach(frame => {
    frame.addEventListener('load', () => {
      const frameDocument = frame.contentDocument;
      if (!frameDocument) return;
      const embeddedStyles = frameDocument.createElement('style');
      embeddedStyles.textContent = '#logo,#top-nav{display:none!important}';
      frameDocument.head.append(embeddedStyles);

      frameDocument.addEventListener('wheel', event => {
        if (event.defaultPrevented || Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
        window.scrollBy({ top: event.deltaY, behavior: 'auto' });
      }, { passive: true });

      let touchStart = null;
      frameDocument.addEventListener('touchstart', event => {
        frame.style.pointerEvents = '';
        if (event.touches.length !== 1) {
          touchStart = null;
          return;
        }
        touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
      }, { passive: true });
      frameDocument.addEventListener('touchmove', event => {
        if (!touchStart || event.defaultPrevented || event.touches.length !== 1 ||
            event.target.closest('#media-viewer.open,#guide.show,#egg.show')) return;
        const touch = event.touches[0];
        const deltaX = touch.clientX - touchStart.x;
        const deltaY = touchStart.y - touch.clientY;
        if (Math.abs(deltaY) <= Math.abs(deltaX) || Math.abs(deltaY) < 8) return;
        event.preventDefault();
        frame.style.pointerEvents = 'none';
        window.scrollBy({ top: deltaY, behavior: 'auto' });
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: false });
      const finishTouch = () => {
        touchStart = null;
        frame.style.pointerEvents = '';
      };
      frameDocument.addEventListener('touchend', finishTouch, { passive: true });
      frameDocument.addEventListener('touchcancel', finishTouch, { passive: true });
    });
  });
</script>
</body>
</html>
